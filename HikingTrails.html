<html>
    <head> 
        <meta charset="utf-8" /> 
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" /> 
        <title>Hiking Trails in Douglas County, OR</title> 
        <style> 
          html, 
          body { 
            background-color: var(--calcite-ui-foreground-2); 
            padding: 0; 
            margin: 0; 
            width: 100vw; 
            height: 100%;}
        calcite-shell-panel[slot="panel-bottom"] {
          width: 100%;
          max-width: 100%;
          --calcite-shell-panel-max-width: 100%;
          --calcite-shell-panel-min-width: 100%;
          --calcite-shell-panel-width: 100%;
        }
        calcite-shell-panel[slot="panel-bottom"]:not([collapsed]) {
          height: 42.5%;
        }
        #profileRow {
          display: flex;
          width: 100%;
          height: 100%;
        }
        #elevationProfile {
          flex: 2;
          height: 100%;
        }
        #trailInfo {
          flex: 1;
          height: 100%;
          overflow: auto;
          padding: 12px;
          border-left: 1px solid #ccc;
          background: white;
          font-family: sans-serif;
          font-size: 13px;
        }
        </style>
        <script>
          window.addEventListener('error', function (e) {
            showError('JS Error: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')');
          });
          window.addEventListener('unhandledrejection', function (e) {
            showError('Promise Rejection: ' + (e.reason?.message || e.reason));
          });
        
          function showError(msg) {
            let box = document.getElementById('debug-box');
            if (!box) {
              box = document.createElement('div');
              box.id = 'debug-box';
              box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
                'background:red;color:white;font-family:monospace;font-size:12px;' +
                'padding:10px;white-space:pre-wrap;max-height:50vh;overflow:auto;';
              document.body ? document.body.prepend(box) : document.addEventListener('DOMContentLoaded', () => document.body.prepend(box));
            }
            box.textContent += msg + '\n\n';
          }
        </script>
        <script type="module" src="https://js.arcgis.com/calcite-components/3.3.3/calcite.esm.js"></script>
        <script src="https://js.arcgis.com/4.34/"></script>
        <script type="module" src="https://js.arcgis.com/4.34/map-components/"></script>
        


    </head> 
    <body class="calcite-mode-light">
      <calcite-shell>
        <calcite-panel heading="Hiking Trails in Douglas County, OR" slot="header"></calcite-panel>
      <arcgis-map id="thismap" basemap="terrain" zoom="9" center="-123.305, 43.25">
        <arcgis-zoom slot="bottom-left" layout="vertical" visual-scale="l"></arcgis-zoom>
        <arcgis-search slot="top-right"></arcgis-search>
        <arcgis-expand slot="bottom-right">
          <arcgis-legend reference-element="thismap" legend-style="classic" hide-layers-not-in-current-view></arcgis-legend>
        </arcgis-expand>
        <arcgis-popup reference-element="thismap" ></arcgis-popup> 
      </arcgis-map>
        <calcite-shell-panel slot="panel-bottom" display-mode="float" id="profilePanel" collapsed>
          <div id="profileRow">
            <arcgis-elevation-profile id="elevationProfile" reference-element="thismap"></arcgis-elevation-profile>
            <div id="trailInfo">Select a trail to see details.</div>
          </div>
       </calcite-shell-panel>
     </calcite-shell>
      
      <script type="module">
        const esriConfig = await $arcgis.import("@arcgis/core/config.js");
        esriConfig.apiKey = "AAPTagkb2Zm4YSaB-Q_Eh-WC00w..jWWHN5Y5w0lptYDha8LVMK2mV9nZeFOccvtYcKio_4alSZzokCcY--7xgGtDAWM2hb6tLfq5YlJ29JqO1CADo81VLYMHgL0DplYFhNzzP-qqG8clYBI5kNpGl6wRaZgbJvx3fLT6bJjZ8sD-vAL3lBhBWBQ02pUJT31Q-fl-wuhUEFx1JCxMgNmVeqvm7yPXftsUsCzHpDZZC3RATuBIpvLo1pp-DwHRqQGVYPBAxZlz4OQNWpsRyj_urds.AT1_stwWKpCr";
        esriConfig.portalUrl = "https://gis.co.douglas.or.us/portal";
        const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");
        const MapImageLayer = await $arcgis.import("@arcgis/core/layers/MapImageLayer.js");
        const VectorTileLayer = await $arcgis.import("@arcgis/core/layers/VectorTileLayer.js");
        const ElevationLayer = await $arcgis.import("@arcgis/core/layers/ElevationLayer.js")
        
        const trailsPopup = {
          title: "Trail: {Name}",
          content: [{type: "fields",
          fieldInfos:[{fieldName: "Name"},{fieldName: "Park"},{fieldName: "Comment"},{fieldName: "Number"},{fieldName: "Condition"},{fieldName: "Attribution"},{fieldName: "Agency"},{fieldName: "TotalMiles"},{fieldName: "SectionMiles"},{fieldName: "ConditionInfo"},{fieldName: "TrailType"}]
          }]}
        const placesPopup = {
          title: "{Name} @ {PlaceName}",
          content: [{type: "fields",
          fieldInfos:[{fieldName: "Name"},{fieldName: "PlaceName"},{fieldName: "Description"},{fieldName: "FacilityType"}]},
            {type: "attachments"}]}
        const hazardPopup = {
          title: "Severity {severity} - {hazardneed}",
          content: [{type: "fields",
          fieldInfos:[{fieldName: "hazardneed"},{fieldName: "severity"},{fieldName: "description"},]},
            {type: "attachments"}]}
        const popupComponent = document.querySelector("arcgis-popup");
        const arcgisMap = document.querySelector("arcgis-map");
        const urlParams = new URLSearchParams(window.location.search);
        const trailParam = urlParams.get("trail"); // e.g. "1414.4"
        const profileElement = document.querySelector("arcgis-elevation-profile");
        const searchElement = document.querySelector("arcgis-search");
        const trailInfoEl = document.querySelector("#trailInfo");
  
        await arcgisMap.componentOnReady();
        await profileElement.componentOnReady();
        await searchElement.componentOnReady();
        await popupComponent.componentOnReady();
        profileElement.referenceElement = arcgisMap;
        
        arcgisMap.map.ground.layers.add(
          new ElevationLayer({ url: "https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer" }))
          const baseVector = new VectorTileLayer({portalItem:{id: "dd271a466f1c4071abfd1128bdcfdd78"}});
          const pois = new FeatureLayer({url: "https://gis.co.douglas.or.us/server/rest/services/Common/DC_Expanded_POI_List/MapServer/2", minScale: "25000" });
          const places = new FeatureLayer({url: "https://gis.co.douglas.or.us/server/rest/services/Common/PlaceParkDetails/MapServer/0", popupTemplate: placesPopup, minScale: "24000"});
          const trails = new FeatureLayer({url: "https://gis.co.douglas.or.us/server/rest/services/Parks/DCParks/MapServer/6", popupTemplate: trailsPopup, minScale: "200000"});
          const hazards = new FeatureLayer({url: "https://gis.co.douglas.or.us/server/rest/services/Hosted/survey123_3829e8e36dd9437883d13977f525fd96_results/FeatureServer/0", popupTemplate: hazardPopup, minscale: "100000"})
          arcgisMap.map.add(baseVector);
          arcgisMap.map.add(pois);
          arcgisMap.map.add(places);
          arcgisMap.map.add(trails);
          arcgisMap.map.add(hazards);

          searchElement.sources = [{
              layer: trails, searchFields: ["Name"], suggestionTemplate: "{Name}", exactMatch: false, placeholder: "Example: Mt. Thielsen"
            },{
              layer: places, searchFields: ["Name"], suggestionTemplate: "{Name}", exactMatch: false
            }]
        
          const profilePanel = document.querySelector("#profilePanel");
          profileElement.profiles = [{type: "ground"}];
          const view = arcgisMap.view;
          view.popupEnabled = false;
      
          // Turns "TotalMiles" -> "Total Miles", "ConditionInfo" -> "Condition Info", etc.
          function humanizeFieldName(fieldName) {
              return fieldName.replace(/([a-z])([A-Z])/g, '$1 $2');
          }
        
          function renderTrailInfo(feature) {
              const a = feature.attributes;
              const fieldInfos = trailsPopup.content[0].fieldInfos;
              const titleHtml = trailsPopup.title.replace(/{(\w+)}/g, (_, key) => a[key] ?? "");
              const rowsHtml = fieldInfos
                  .map(fi => {
                      const value = a[fi.fieldName];
                      //if (value === null || value === undefined || value === "") return "";
                          return `<div style="margin-bottom:4px;"><strong>${humanizeFieldName(fi.fieldName)}:</strong> ${value}</div>`;
                      })
                      .join("");
                  
                      trailInfoEl.innerHTML = `
                      <h4 style="margin:0 0 8px;">${titleHtml}</h4>
                      ${rowsHtml}
                    `;
                  }

          async function selectTrailFeature(feature) {
            profileElement.input = feature;
            profilePanel.collapsed = false;
           // view.popupEnabled = false; - not needed anymore
           // setTimeout(() => view.popupEnabled = true, 100);
          try {
            await view.goTo(feature.geometry, { duration: 0 });
          } catch (err) {
            console.warn("goTo animation failed, continuing without animation:", err);
          }
            if (trailInfoEl) {
              renderTrailInfo(feature);
            }
          }
        
          view.on("click", async (event) => {
            const hitResult = await view.hitTest(event);
            const hit = hitResult.results.find(
              r => r.type === "graphic" && r.graphic.geometry?.type === "polyline");
            if (hit) {
              view.closePopup();
              const objectId = hit.graphic.attributes[trails.objectIdField];
              const result = await trails.queryFeatures({
                objectIds: [objectId],
                outFields: ["*"],
                returnGeometry: true
              });
            if (result.features.length > 0) {
              await selectTrailFeature(result.features[0]);
            }
        }   else {
            // Not a trail — open the normal popup for whatever else was clicked (POIs, places, hazards)
            const otherHit = hitResult.results.find(r => r.type === "graphic");
            if (otherHit) {
              view.openPopup({
                features: [otherHit.graphic],
                location: event.mapPoint
              });
            }
          }
        })
        
          async function zoomToTrailByNumber(numberValue) {
            const safeValue = numberValue.replace(/'/g, "");
            const result = await trails.queryFeatures({
              where: `Number = '${safeValue}'`,   // remove quotes in where clause if Number is numeric
              outFields: ["*"],
              returnGeometry: true
            });
        
            if (result.features.length > 0) {
              await selectTrailFeature(result.features[0]);
            } else {
              console.warn(`No trail found with Number = ${numberValue}`);
            }
          }
        
          if (trailParam) {
            await zoomToTrailByNumber(trailParam);
          }

      </script>
    </body>
</html>
